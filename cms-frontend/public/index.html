<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- v1.81.0 — every icon comes from the server, made square from the
         company logo uploaded in Settings › Company (so each company shows
         its own logo, never the React logo). BrandingContext.js refreshes
         these addresses once the app has loaded. -->
    <link rel="icon" href="%REACT_APP_API_URL%/public/branding/favicon.ico" id="app-favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1f3a" />
    <!-- v1.71.0 — apply the person's Light/Dark/Device choice BEFORE the
         app loads, so a dark-mode user never sees a white flash. Must
         match contexts/ThemeContext.js (same localStorage key). -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('cms-theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- %REACT_APP_COMPANY_NAME% (v1.32.6) — substituted at BUILD time from
         render.yaml/render.company-b.yaml's own REACT_APP_COMPANY_NAME, so
         each company's deployment gets its own correct tab title/description
         baked in from the very first paint (before any JS runs), not just
         the generic Create React App default every company's build
         previously shared. BrandingContext.js separately keeps
         document.title in sync with the live database value afterwards. -->
    <meta
      name="description"
      content="%REACT_APP_COMPANY_NAME% — Company Management System"
    />
    <!-- Home-screen icon (iPhone / iPad) and the "install / add to home
         screen" details (Android, desktop Chrome / Edge): company name and
         logo, from the server (v1.81.0). -->
    <link rel="apple-touch-icon" href="%REACT_APP_API_URL%/public/branding/apple-touch-icon.png" />
    <link rel="manifest" href="%REACT_APP_API_URL%/public/branding/manifest.webmanifest" crossorigin="anonymous" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="%REACT_APP_COMPANY_NAME%" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>%REACT_APP_COMPANY_NAME%</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
