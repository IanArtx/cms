<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- id="app-favicon" (v1.32.6) — BrandingContext.js swaps this href to
         the live-uploaded company logo at runtime, so the browser tab icon
         stays correct even if Settings > Company's logo changes after this
         file was built. The %PUBLIC_URL%/favicon.ico below is just the
         pre-JS-load / no-JS fallback. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" id="app-favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <!-- %REACT_APP_COMPANY_NAME% (v1.32.6) — substituted at BUILD time from
         render.yaml/render.company-b.yaml's own REACT_APP_COMPANY_NAME, so
         each company's deployment gets its own correct tab title/description
         baked in from the very first paint (before any JS runs), not just
         the generic Create React App default every company's build
         previously shared. BrandingContext.js separately keeps
         document.title in sync with the live database value afterwards. -->
    <meta
      name="description"
      content="%REACT_APP_COMPANY_NAME% — Company Management System"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>%REACT_APP_COMPANY_NAME%</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
